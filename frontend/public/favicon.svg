<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: dark rounded square -->
  <rect width="32" height="32" rx="7" fill="#11182A"/>

  <!--
    λ shape:
    - Top cap: short horizontal line at top-left
    - Main diagonal: goes from top-right of cap down to bottom-right (amber, primary)
    - Branch: from midpoint of main diagonal splits down to bottom-left (muted)
  -->

  <!-- Top cap (left serif of λ) -->
  <line x1="8" y1="8" x2="13.5" y2="8" stroke="#B87826" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Main stroke: top-right down to bottom-right -->
  <line x1="13.5" y1="8" x2="25" y2="25" stroke="#B87826" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Branch: from midpoint (~16,15) down to bottom-left -->
  <line x1="19" y1="16.5" x2="10" y2="25" stroke="#6E7791" stroke-width="2.4" stroke-linecap="round"/>
</svg>
